{% extends 'base.html' %}

{% block title %}Organizer Login - Sports Scoreboard Arena{% endblock %}

{% block content %}
<div class="arena-container" style="max-width:480px; padding-top:4rem;">

  <div class="card-glass" style="padding:2.5rem; border-color:rgba(0,255,135,0.3); box-shadow:0 15px 45px rgba(0,0,0,0.6), 0 0 25px rgba(0,255,135,0.15);">
    <div style="text-align:center; margin-bottom:2rem;">
      <div class="brand-emblem" style="margin:0 auto 1rem; width:52px; height:52px; font-size:1.6rem;">⚡</div>
      <h1 style="font-family:var(--font-main); font-size:1.75rem; font-weight:900;">Organizer Login</h1>
      <p style="color:var(--text-sub); font-size:0.9rem; margin-top:0.35rem;">Access tournament manager & live scorer terminals</p>
    </div>

    <!-- Quick Demo Auto-Fill Pill -->
    <div style="background:rgba(0,255,135,0.08); border:1px solid rgba(0,255,135,0.25); border-radius:var(--radius-sm); padding:0.75rem; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; font-size:0.85rem;">
      <div>
        <div style="color:var(--accent-lime); font-weight:700;">⚡ Demo Credentials:</div>
        <div style="color:var(--text-sub); font-family:var(--font-mono);">admin / admin123</div>
      </div>
      <button type="button" onclick="autoFillDemo()" class="btn btn-lime btn-sm" style="font-size:0.78rem;">
        Fill Demo
      </button>
    </div>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.88rem; font-weight:600; color:#fff; margin-bottom:0.4rem;">Username</label>
        <input type="text" id="login-username" name="username" required class="scorer-input" placeholder="Enter username">
      </div>

      <div style="margin-bottom:1.75rem;">
        <label style="display:block; font-size:0.88rem; font-weight:600; color:#fff; margin-bottom:0.4rem;">Password</label>
        <input type="password" id="login-password" name="password" required class="scorer-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-lime btn-lg" style="width:100%; margin-bottom:1.25rem;" id="login-submit-btn">
        Log In to Arena Console
      </button>

      <div style="text-align:center; font-size:0.88rem; color:var(--text-sub);">
        Don't have an organizer account? 
        <a href="{{ url_for('register') }}" style="color:var(--accent-lime); font-weight:700;">Sign up free</a>
      </div>
    </form>
  </div>

</div>

<script>
function autoFillDemo() {
  document.getElementById('login-username').value = 'admin';
  document.getElementById('login-password').value = 'admin123';
}
</script>
{% endblock %}
